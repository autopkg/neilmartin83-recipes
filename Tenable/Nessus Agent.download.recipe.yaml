Description: Downloads the latest Tenable Nessus Agent disk image (.dmg) from Tenable and verifies the Install Nessus Agent.pkg signature.
Comment: |
  Version comes from Tenable's downloads API (its structured "version" field), not the download
  page or the .dmg filename - the vendor pkg's own metadata is unusable (Distribution and
  PackageInfo both report 1.0.0). The regex anchors to the unique NessusAgent-latest.dmg entry so
  it always resolves to the current release.
Identifier: com.github.neilmartin83-recipes.download.Nessus Agent
MinimumVersion: "2.3"

Input:
  NAME: Nessus Agent

Process:
  - Processor: URLTextSearcher
    Arguments:
      url: https://www.tenable.com/downloads/api/v2/pages/nessus-agents
      re_pattern: '"version":"(?P<version>\d+\.\d+\.\d+)"[^}]*?NessusAgent-latest\.dmg'

  - Processor: URLDownloader
    Arguments:
      url: https://www.tenable.com/downloads/api/v2/pages/nessus-agents/files/NessusAgent-latest.dmg?i_agree_to_tenable_license_agreement=true
      filename: "%NAME%-%version%.dmg"

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%/Install Nessus Agent.pkg"
      expected_authority_names:
        - "Developer ID Installer: Tenable, Inc. (4B8J598M7U)"
        - Developer ID Certification Authority
        - Apple Root CA
